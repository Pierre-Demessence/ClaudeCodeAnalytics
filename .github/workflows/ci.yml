name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The widget is Windows-only, and its golden images are rendered with Windows' fonts.
  widget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widget
      - run: cargo test --locked --manifest-path widget/Cargo.toml
      - run: cargo clippy --locked --manifest-path widget/Cargo.toml --all-targets -- -D warnings
