[package]
name = "cca-widget"
version = "0.0.0"
description = "Taskbar widget for Claude Code Analytics"
edition = "2021"

[lib]
name = "cca_widget_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging"
] }
