services:
  dashboard:
    build: .
    image: claudecodeanalytics:latest
    restart: unless-stopped
    # No published port: only Traefik (bound to 127.0.0.1:80) reaches the
    # dashboard. Vite's default allowedHosts accepts `*.localhost`, which
    # blocks DNS-rebinding requests with any other Host header. Its network is
    # shared with Traefik alone, so other containers cannot call the API by IP.
    networks:
      - claudecodeanalytics
    labels:
      - traefik.enable=true
      - traefik.docker.network=claudecodeanalytics
      - traefik.http.routers.claudecodeanalytics.rule=Host(`analytics.claudecode.localhost`)
      - traefik.http.routers.claudecodeanalytics.entrypoints=web
      - traefik.http.services.claudecodeanalytics.loadbalancer.server.port=4173
    volumes:
      # Transcripts and the OAuth token: read-only, the token is only read.
      - ${USERPROFILE:?Run from Windows, where USERPROFILE is set}/.claude:/claude:ro
      # The user's history, also written by host runs (`npm run dev`, `collect`).
      - ${USERPROFILE}/.claude-code-analytics:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  claudecodeanalytics:
    external: true
